# ============================================================
# Vérification automatique à chaque envoi sur GitHub.
# Une croix rouge = ne pas mettre en ligne.
# ============================================================
name: Vérification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  securite-base:
    name: Sécurité de la base (cloisonnement, paiements, RGPD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: PostgreSQL disponible
        run: ls /usr/lib/postgresql/*/bin/initdb || (sudo apt-get update && sudo apt-get install -y postgresql)
      - name: Tests de sécurité
        run: bash scripts/tester-base.sh

  application:
    name: Application (tests, compilation, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Installation
        run: bun install
      - name: Versions installées
        run: echo "::notice title=Versions::$(bun pm ls 2>/dev/null | grep -E '@tanstack/react-(start|router)@|@supabase/supabase-js@|stripe@|zod@|typescript@' | tr '\n' ' ')"
      - name: Tests de logique
        run: bun test tests
      - name: Compilation
        run: bun run build
      - name: Vérification des types
        run: |
          set +e
          bunx tsc --noEmit --pretty false > tsc.txt 2>&1
          code=$?
          # Toute la liste des erreurs dans une seule annotation (GitHub en limite le nombre)
          if [ $code -ne 0 ]; then
            grep -E "error TS" tsc.txt | cut -c1-220 | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > liste.txt
            echo "::error title=Types ($(grep -c 'error TS' tsc.txt) erreurs)::$(cat liste.txt)"
          fi
          exit $code
